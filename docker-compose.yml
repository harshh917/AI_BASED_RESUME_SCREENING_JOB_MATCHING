services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: resume_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-resume_pass}
      POSTGRES_DB: resume_matching
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/docker-init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U resume_user -d resume_matching"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg2://resume_user:${POSTGRES_PASSWORD:-resume_pass}@postgres:5432/resume_matching
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?set JWT_SECRET_KEY in a .env file next to docker-compose.yml}
      UPLOAD_DIR: /app/uploads/resumes
      EMBEDDING_BACKEND: ${EMBEDDING_BACKEND:-sentence_transformer}
      CORS_ORIGINS: http://localhost:5173,http://localhost:3000
    volumes:
      - uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: http://localhost:8000
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  pgdata:
  uploads:
